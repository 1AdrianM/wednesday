quarkus.application.name=wednesday

# Every line carries the session id (empty outside a session). See common.SessionLogContext.
quarkus.log.console.format=%d{HH:mm:ss,SSS} %-5p [sid=%X{sessionId}] [%c{3.}] (%t) %s%e%n

# Language model for browser sessions: gemini (needs GEMINI_API_KEY) or fake (offline).
wednesday.llm.provider=${WEDNESDAY_LLM:gemini}
wednesday.context.turns=20
%test.wednesday.llm.provider=fake
